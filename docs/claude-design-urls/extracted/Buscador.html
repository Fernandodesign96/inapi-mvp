<dc-import name="SiteHeader" active="" current="Buscador" page-title="Resultados de búsqueda" page-subtitle="Encuentra páginas, trámites y noticias del sitio de INAPI." hint-size="100%,220px"></dc-import>

<main style="max-width:1140px;margin:0 auto;padding:8px 24px 56px">

  <form sc-camel-on-submit="{{ onSubmit }}" role="search" style="display:flex;gap:12px;margin:8px 0 32px;max-width:640px">
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #808080;flex:1">
      <input type="text" value="{{ query }}" sc-camel-on-input="{{ onInput }}" placeholder="Buscar en el sitio" aria-label="Buscar en el sitio" style="flex:1;border:none;padding:12px 14px;font-family:inherit;font-size:15px;outline:none">
      <span class="ms" style="font-size:20px;color:#666;padding-right:12px">search</span>
    </div>
    <button type="submit" style="background:#0051A8;color:#fff;border:none;padding:12px 28px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer" style-hover="background:#003B8D">Buscar</button>
  </form>

  <p style="font-size:14px;color:#666;margin:0 0 24px">{{ resultLabel }}</p>

  <div style="display:flex;flex-direction:column;gap:4px">
    <sc-for list="{{ visibleResults }}" as="r" hint-placeholder-count="5">
      <a href="{{ r.href }}" style="text-decoration:none;color:inherit;display:block;padding:20px 0;border-bottom:1px solid #E6E6E6" style-hover="background:#F7FAFD">
        <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#0F69C4;margin:0 0 6px">{{ r.category }}</p>
        <h3 style="font-size:18px;font-weight:700;color:#0F69C4;margin:0 0 6px;text-decoration:underline">{{ r.title }}</h3>
        <p style="font-size:14px;line-height:1.6;color:#666;margin:0">{{ r.summary }}</p>
      </a>
    </sc-for>
  </div>

  <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
    <div style="text-align:center;padding:56px 24px;color:#666">
      <span class="ms" style="font-size:40px;color:#999">search_off</span>
      <p style="font-size:16px;margin:12px 0 0">No hay resultados para "{{ query }}". Prueba con otra palabra clave.</p>
    </div>
  </sc-if>

</main>

<dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  state = { query: '', applied: '' };

  index = [
    { title: 'Marcas', category: 'Trámites', summary: 'Registra, renueva o consulta el estado de una marca comercial.', href: 'Marcas.dc.html' },
    { title: 'Patentes', category: 'Trámites', summary: 'Protege una invención mediante una patente de tu titularidad.', href: 'Patentes.dc.html' },
    { title: 'Ingresar una solicitud nueva de marca', category: 'Trámites', summary: 'Completa el formulario en línea para solicitar el registro de tu marca.', href: 'Solicitud-Nueva-de-Marca.dc.html' },
    { title: 'Buscador de Anterioridades', category: 'Herramientas', summary: 'Compara tu marca con las ya inscritas antes de presentar tu solicitud.', href: 'Buscador-de-Anterioridades.dc.html' },
    { title: 'Acerca de INAPI', category: 'Institucional', summary: 'Conoce las funciones, objetivos y estructura del Instituto Nacional de Propiedad Industrial.', href: 'Acerca-de-INAPI.dc.html' },
    { title: 'Sala de Prensa', category: 'Noticias', summary: 'Revisa las noticias y comunicados de INAPI.', href: 'Sala-de-Prensa.dc.html' },
    { title: 'INAPI realizó su Cuenta Pública Participativa 2026 en Valparaíso', category: 'Noticias', summary: 'La jornada mostró los avances en eficiencia, liderazgo internacional y descentralización de la propiedad industrial.', href: 'Noticia-Cuenta-Publica-2026.dc.html' },
    { title: 'Chile alcanza su mayor cifra de solicitudes de patentes nacionales en más de una década', category: 'Noticias', summary: 'Inventores chilenos presentaron 296 solicitudes en seis meses.', href: 'Noticia-Patentes-Nacionales.dc.html' },
    { title: 'Atención ciudadana (SIAC)', category: 'Contacto', summary: 'Envía tus consultas, reclamos o sugerencias a INAPI.', href: 'SIAC.dc.html' }
  ];

  componentDidMount() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('searchQuery') || '';
    this.setState({ query: q, applied: q });
  }

  onInput = (e) => this.setState({ query: e.target.value });
  onSubmit = (e) => { e.preventDefault(); this.setState({ applied: this.state.query.trim() }); };

  renderVals() {
    const q = this.state.applied.toLowerCase();
    const visibleResults = q
      ? this.index.filter(r => (r.title + ' ' + r.summary + ' ' + r.category).toLowerCase().includes(q))
      : this.index;
    const resultLabel = this.state.applied
      ? visibleResults.length + ' resultado(s) para "' + this.state.applied + '"'
      : 'Mostrando ' + this.index.length + ' páginas del sitio';
    return {
      query: this.state.query,
      onInput: this.onInput,
      onSubmit: this.onSubmit,
      visibleResults,
      resultLabel,
      noResults: visibleResults.length === 0
    };
  }
}
</script>
