<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Roboto',-apple-system,Arial,sans-serif;color:#373737;background:#fff;text-align:left}
  .ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle}
  a{color:#0F69C4}
  a:hover{color:#003078}
</style>
</helmet>

<dc-import name="SiteHeader" active="conecta" current="Sala de Prensa" page-title="Sala de Prensa" page-subtitle="Revisa las noticias y los comunicados de INAPI sobre propiedad industrial, gestión institucional y actividades para la comunidad." hint-size="100%,260px"></dc-import>

<main style="max-width:1140px;margin:0 auto;padding:8px 24px 56px">

  <!-- Buscador -->
  <form role="search" sc-camel-on-submit="{{ onSubmit }}" style="display:flex;gap:12px;margin:8px 0 32px;max-width:640px">
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #808080;flex:1">
      <input type="text" value="{{ query }}" sc-camel-on-input="{{ onInput }}" placeholder="Buscar noticias por palabra clave" aria-label="Buscar noticias" style="flex:1;border:none;padding:12px 14px;font-family:inherit;font-size:15px;outline:none">
      <span class="ms" style="font-size:20px;color:#666;padding-right:12px">search</span>
    </div>
    <button type="submit" style="background:#0051A8;color:#fff;border:none;padding:12px 28px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer" style-hover="background:#003B8D">Buscar</button>
  </form>

  <p style="font-size:14px;color:#666;margin:0 0 20px">{{ resultLabel }}</p>

  <!-- Resultados -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
    <sc-for list="{{ visibleNews }}" as="item" hint-placeholder-count="6">
      <a href="{{ item.href }}" style="text-decoration:none;color:inherit;background:#fff;border:1px solid #E6E6E6;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:box-shadow 150ms ease,border-color 150ms ease" style-hover="border-color:#0F69C4;box-shadow:0 4px 12px rgba(0,0,0,.12)">
        <image-slot id="{{ item.slotId }}" style="width:100%;height:170px" shape="rect" fit="cover" placeholder="{{ item.imgAlt }}"></image-slot>
        <div style="padding:20px;display:flex;flex-direction:column;gap:10px;flex:1">
          <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#0F69C4;margin:0"><time datetime="{{ item.datetime }}">{{ item.date }}</time></p>
          <h3 style="font-size:16px;font-weight:700;color:#111;margin:0;line-height:1.4">{{ item.title }}</h3>
          <p style="font-size:14px;color:#666;line-height:1.6;margin:0">{{ item.summary }}</p>
        </div>
      </a>
    </sc-for>
  </div>

  <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
    <div style="text-align:center;padding:56px 24px;color:#666">
      <span class="ms" style="font-size:40px;color:#999">search_off</span>
      <p style="font-size:16px;margin:12px 0 0">No hay noticias que coincidan con “{{ query }}”. Prueba con otra palabra clave.</p>
    </div>
  </sc-if>

  <sc-if value="{{ showMoreButton }}" hint-placeholder-val="{{ false }}">
    <div style="text-align:center;margin-top:40px">
      <button type="button" sc-camel-on-click="{{ onShowAll }}" style="display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0051A8;border:2px solid #0051A8;border-radius:0;padding:14px 36px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)" style-hover="background:#0051A8;color:#fff">Ver todas las noticias<span class="ms" style="font-size:20px">expand_more</span></button>
    </div>
  </sc-if>

  <sc-if value="{{ showPagination }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Paginación de noticias" style="display:flex;justify-content:center;align-items:center;gap:6px;margin-top:48px;font-family:'Roboto',sans-serif;font-size:15px;color:#111">
      <button type="button" sc-camel-on-click="{{ onPrevPage }}" disabled="{{ isFirstPage }}" style="display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:#0F69C4;font-weight:700;font-size:15px;padding:8px 10px;cursor:pointer;opacity:{{ isFirstPage ? 0.4 : 1 }}" style-hover="text-decoration:underline"><span class="ms" style="font-size:20px">chevron_left</span>Página anterior</button>
      <sc-for list="{{ pageNums }}" as="p" hint-placeholder-count="4">
        <sc-if value="{{ p.isEllipsis }}" hint-placeholder-val="{{ false }}">
          <span style="min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:#666">…</span>
        </sc-if>
        <sc-if value="{{ !p.isEllipsis }}" hint-placeholder-val="{{ true }}">
          <button type="button" sc-camel-on-click="{{ p.onClick }}" aria-current="{{ p.isCurrent ? 'page' : undefined }}" style="min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid {{ p.isCurrent ? '#0051A8' : '#CCC' }};border-radius:4px;background:{{ p.isCurrent ? '#0051A8' : '#fff' }};color:{{ p.isCurrent ? '#fff' : '#111' }};font-weight:{{ p.isCurrent ? 700 : 400 }};font-family:inherit;font-size:15px;cursor:pointer;padding:0 6px" style-hover="border-color:#0051A8">{{ p.value }}</button>
        </sc-if>
      </sc-for>
      <button type="button" sc-camel-on-click="{{ onNextPage }}" disabled="{{ isLastPage }}" style="display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:#0F69C4;font-weight:700;font-size:15px;padding:8px 10px;cursor:pointer;opacity:{{ isLastPage ? 0.4 : 1 }}" style-hover="text-decoration:underline">Página siguiente<span class="ms" style="font-size:20px">chevron_right</span></button>
    </nav>
  </sc-if>

</main>

<dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script="">
const PAGE_SIZE_INITIAL = 6;
const PAGE_SIZE_EXPANDED = 9;

class Component extends DCLogic {
  state = { query: '', applied: '', showAll: false, page: 1 };

  news = [
    { title: 'INAPI realizó su Cuenta Pública Participativa 2026 en Valparaíso', date: '21 de junio de 2026', datetime: '2026-06-21', summary: 'La jornada mostró los avances en eficiencia, liderazgo internacional y descentralización de la propiedad industrial.', href: 'Noticia-Cuenta-Publica-2026.dc.html', slotId: 'np-1', imgAlt: 'Cuenta Pública 2026' },
    { title: 'Chile alcanza su mayor cifra de solicitudes de patentes nacionales en más de una década', date: '21 de junio de 2026', datetime: '2026-06-21', summary: 'Inventores chilenos presentaron 296 solicitudes en seis meses. La Serena lidera el ranking comunal.', href: 'Noticia-Patentes-Nacionales.dc.html', slotId: 'np-2', imgAlt: 'Patentes nacionales' },
    { title: 'INAPI promueve la participación de innovadores y diseñadores chilenos en certámenes regionales de ASIPI', date: '30 de julio de 2026', datetime: '2026-07-30', summary: 'El Director Nacional, Esteban Figueroa, se reunió con la representación en Chile de ASIPI para abordar dos concursos de innovación y diseño que se premiarán en Santiago.', href: '#', slotId: 'np-3', imgAlt: 'Certámenes ASIPI' },
    { title: 'ClaveÚnica: INAPI refuerza la seguridad de sus trámites en línea e invita a activar el segundo factor de autenticación', date: '30 de julio de 2026', datetime: '2026-07-30', summary: 'La medida, impulsada por la Secretaría de Gobierno Digital, agrega una capa adicional de protección para resguardar la identidad digital de las personas.', href: '#', slotId: 'np-4', imgAlt: 'ClaveÚnica' },
    { title: 'INAPI reunió al ecosistema de innovación para potenciar el uso estratégico de la información de patentes', date: '23 de julio de 2026', datetime: '2026-07-23', summary: 'Empresas, startups, universidades y organismos públicos conocieron cómo la información de patentes apoya la toma de decisiones y la vigilancia tecnológica.', href: '#', slotId: 'np-5', imgAlt: 'Ecosistema de innovación' },
    { title: 'INAPI amplía plazos para trámites en zonas afectadas por el sistema frontal', date: '21 de julio de 2026', datetime: '2026-07-21', summary: 'La medida beneficia a las personas usuarias de las zonas con emergencia por lluvias.', href: '#', slotId: 'np-6', imgAlt: 'Ampliación de plazos' },
    { title: 'INAPI consolida su agenda de cooperación internacional en las Asambleas de la OMPI', date: '15 de julio de 2026', datetime: '2026-07-15', summary: 'La delegación chilena firmó acuerdos con oficinas líderes de Europa, Asia y América Latina.', href: '#', slotId: 'np-7', imgAlt: 'Asambleas OMPI' },
    { title: 'Startup chilena Drovid obtiene el Premio Mundial de la OMPI 2026', date: '10 de julio de 2026', datetime: '2026-07-10', summary: 'La empresa fue reconocida por su tecnología con drones e IA para detectar incendios forestales.', href: '#', slotId: 'np-8', imgAlt: 'Premio OMPI Drovid' },
    { title: 'INAPI inicia nueva edición de los “Martes de PI” con ciclo formativo abierto a todo el país', date: '4 de mayo de 2026', datetime: '2026-05-04', summary: 'El ciclo formativo busca acercar el conocimiento sobre propiedad industrial a un público amplio y diverso en todo el país, en su séptimo año de realización.', href: '#', slotId: 'np-9', imgAlt: 'Martes de PI' },
    { title: 'OMPI e INAPI realizan sexta versión del taller internacional de redacción de patentes con foco en el sistema PCT', date: '28 de abril de 2026', datetime: '2026-04-28', summary: 'La iniciativa reunió a participantes de distintos países de América Latina para fortalecer las capacidades técnicas en la redacción de solicitudes de patentes.', href: '#', slotId: 'np-10', imgAlt: 'Taller PCT' },
    { title: 'INAPI conmemora el Día Mundial de la Propiedad Intelectual con reconocimientos a actores clave de la innovación', date: '22 de abril de 2026', datetime: '2026-04-22', summary: 'La instancia presentó los principales avances de la propiedad industrial en Chile y premió a quienes lideran el uso del sistema en el país.', href: '#', slotId: 'np-11', imgAlt: 'Día Mundial de la PI' },
    { title: 'INAPI convoca a beca del Gobierno de China para Maestría en Propiedad Intelectual', date: '14 de abril de 2026', datetime: '2026-04-14', summary: 'El proceso selecciona y patrocina dos candidaturas nacionales para un programa académico internacional de dos años dirigido a profesionales de la PI.', href: '#', slotId: 'np-12', imgAlt: 'Beca China' },
    { title: 'INAPI impulsa estrategia de propiedad industrial para posicionar la lana de Magallanes en mercados internacionales', date: '14 de abril de 2026', datetime: '2026-04-14', summary: 'La iniciativa, desarrollada con la OMPI y actores públicos y privados de la región, crea una marca comercial y una marca de certificación para este producto chileno.', href: '#', slotId: 'np-13', imgAlt: 'Lana de Magallanes' },
    { title: 'INAPI celebra la Semana de la Propiedad Intelectual con foco en la innovación y el valor estratégico de los activos', date: '14 de abril de 2026', datetime: '2026-04-14', summary: 'Una agenda de actividades presenciales y virtuales conecta a la ciudadanía con el ecosistema creativo y culmina con la Cuenta Pública institucional.', href: '#', slotId: 'np-14', imgAlt: 'Semana de la PI' },
    { title: 'INAPI impulsa el uso de información de patentes para fortalecer la innovación en sectores productivos estratégicos', date: '13 de abril de 2026', datetime: '2026-04-13', summary: 'Reuniones con empresas y talleres especializados acercan herramientas de vigilancia tecnológica y análisis de tendencias a la industria.', href: '#', slotId: 'np-15', imgAlt: 'Información de patentes' },
    { title: 'INAPI y Red GT premian a mujeres protagonistas en innovación tecnológica 2026', date: '26 de marzo de 2026', datetime: '2026-03-26', summary: 'El reconocimiento distinguió, en su cuarta edición, a dos innovadoras por sus aportes en biotecnología y tratamiento de residuos industriales.', href: '#', slotId: 'np-16', imgAlt: 'Mujeres en innovación' },
    { title: 'INAPI y Corfo promueven el uso estratégico de la propiedad industrial en la Región de Coquimbo', date: '25 de marzo de 2026', datetime: '2026-03-25', summary: 'Un taller en La Serena reunió a representantes del sector público, empresarial y académico para fortalecer las capacidades regionales en propiedad industrial.', href: '#', slotId: 'np-17', imgAlt: 'Taller Coquimbo' },
    { title: 'INAPI y OMPI abren convocatoria para taller internacional de redacción de patentes', date: '19 de marzo de 2026', datetime: '2026-03-19', summary: 'La iniciativa, gratuita y de alcance internacional, busca mejorar la calidad de las solicitudes de patentes en Chile y Latinoamérica.', href: '#', slotId: 'np-18', imgAlt: 'Redacción de patentes' }
  ];

  onInput = (e) => this.setState({ query: e.target.value });
  onSubmit = (e) => { e.preventDefault(); this.setState({ applied: this.state.query.trim(), showAll: true, page: 1 }); };
  onShowAll = () => this.setState({ showAll: true, page: 1 });
  onPageChange = (p) => this.setState({ page: p });

  renderVals() {
    const q = this.state.applied.toLowerCase();
    const sorted = [...this.news].sort((a, b) => new Date(b.datetime) - new Date(a.datetime));
    const matched = q
      ? sorted.filter(n => (n.title + ' ' + n.summary).toLowerCase().includes(q))
      : sorted;

    const totalPages = Math.max(1, Math.ceil(matched.length / PAGE_SIZE_EXPANDED));
    const page = Math.min(this.state.page, totalPages);
    const paginated = this.state.showAll
      ? matched.slice((page - 1) * PAGE_SIZE_EXPANDED, page * PAGE_SIZE_EXPANDED)
      : matched.slice(0, PAGE_SIZE_INITIAL);

    const resultLabel = this.state.applied
      ? matched.length + ' noticia(s) para “' + this.state.applied + '”'
      : (this.state.showAll ? 'Mostrando ' + paginated.length + ' de ' + matched.length + ' noticias' : 'Mostrando las 6 noticias más recientes');

    const siblings = 1;
    const left = Math.max(2, page - siblings);
    const right = Math.min(totalPages - 1, page + siblings);
    let pageNums = [1];
    if (left > 2) pageNums.push('…');
    for (let p = left; p <= right; p++) pageNums.push(p);
    if (right < totalPages - 1) pageNums.push('…');
    if (totalPages > 1) pageNums.push(totalPages);
    pageNums = pageNums.filter((p, i, arr) => p !== arr[i - 1]).map(p => ({
      value: p,
      isEllipsis: p === '…',
      isCurrent: p === page,
      onClick: p === '…' ? null : () => this.onPageChange(p)
    }));

    return {
      query: this.state.query,
      onInput: this.onInput,
      onSubmit: this.onSubmit,
      onShowAll: this.onShowAll,
      onPageChange: this.onPageChange,
      onPrevPage: () => this.onPageChange(page - 1),
      onNextPage: () => this.onPageChange(page + 1),
      visibleNews: paginated,
      resultLabel,
      noResults: matched.length === 0,
      showMoreButton: !this.state.showAll && matched.length > PAGE_SIZE_INITIAL,
      showPagination: this.state.showAll && totalPages > 1,
      pageNums,
      isFirstPage: page === 1,
      isLastPage: page === totalPages
    };
  }
}
</script>
